name: Benchmark Thread Contention

on:
  push:
    branches:
      - rhpcblasctl-benchmark
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::Rcpp
            any::RcppArmadillo
            any::R6
            any::data.table
            any::MatrixExtra
            any::float
            any::lgr
            any::RhpcBLASctl
            any::Matrix

      - name: Build and Install rsparse
        run: |
          R CMD build .
          R CMD INSTALL rsparse_*.tar.gz

      - name: Run Benchmark
        run: |
          Rscript inst/benchmarks/benchmark_contention.R
